<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ella Agent 总览流程图 v2</title>
  <desc id="desc">更清晰的前后端总览图，按入口路由、三条分支和 workflow 细节分层展示。</desc>
  <defs>
    <style>
      .bg { fill: #f6f3eb; }
      .panel { fill: #fffdf8; stroke: #c7b892; stroke-width: 2; rx: 20; ry: 20; }
      .panelTitle { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #2a2a2a; }
      .sectionTitle { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #38424f; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 14; ry: 14; }
      .chatBox { fill: #eef8f1; stroke: #3f7b56; stroke-width: 2; rx: 14; ry: 14; }
      .clarifyBox { fill: #fff2f0; stroke: #b44c43; stroke-width: 2; rx: 14; ry: 14; }
      .workflowBox { fill: #eef5ff; stroke: #3f6fa8; stroke-width: 2; rx: 14; ry: 14; }
      .cacheBox { fill: #f4f0ff; stroke: #7a59b4; stroke-width: 2; rx: 14; ry: 14; }
      .decision { fill: #fff7dc; stroke: #a67b00; stroke-width: 2.5; }
      .label { font: 700 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #23303d; }
      .sub { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4b5563; }
      .tiny { font: 500 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #5a6472; }
      .arrow { stroke: #586474; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#586474"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1080"/>
  <text class="panelTitle" x="50" y="56">Ella Agent 前后端总览流程图</text>
  <text class="sub" x="50" y="84">把整体流程拆成三层：入口路由、planner 分流、具体执行。</text>

  <rect class="panel" x="40" y="110" width="1520" height="220"/>
  <text class="sectionTitle" x="65" y="148">1. 入口与路由</text>

  <rect class="box" x="90" y="185" width="230" height="78"/>
  <text class="label" x="150" y="220">Frontend 输入</text>
  <text class="sub" x="126" y="245">message + 可选 session_id</text>

  <rect class="box" x="390" y="185" width="220" height="78"/>
  <text class="label" x="444" y="220">POST /api/chat</text>
  <text class="sub" x="432" y="245">或 /api/chat/debug</text>

  <rect class="box" x="680" y="185" width="220" height="78"/>
  <text class="label" x="742" y="220">ChatService</text>
  <text class="sub" x="731" y="245">统一入口</text>

  <polygon class="decision" points="1040,170 1140,225 1040,280 940,225"/>
  <text class="label" x="982" y="218">是否有 pending</text>
  <text class="label" x="996" y="240">clarification</text>

  <rect class="box" x="1210" y="185" width="260" height="78"/>
  <text class="label" x="1278" y="220">WorkflowPlanner</text>
  <text class="sub" x="1242" y="245">plan / resolve_clarification</text>

  <path class="arrow" d="M 320 224 L 390 224"/>
  <path class="arrow" d="M 610 224 L 680 224"/>
  <path class="arrow" d="M 900 224 L 940 224"/>
  <path class="arrow" d="M 1140 224 L 1210 224"/>
  <text class="tiny" x="1072" y="166">有 / 无</text>

  <rect class="panel" x="40" y="360" width="1520" height="300"/>
  <text class="sectionTitle" x="65" y="398">2. Planner 分成三条路径</text>

  <rect class="chatBox" x="100" y="450" width="410" height="160"/>
  <text class="sectionTitle" x="255" y="487">A. chat</text>
  <rect class="box" x="130" y="515" width="160" height="56"/>
  <text class="label" x="173" y="549">ChatAgent</text>
  <rect class="box" x="320" y="515" width="160" height="56"/>
  <text class="label" x="350" y="549">AgentRuntime</text>
  <text class="sub" x="133" y="595">普通问答进入通用 agent runtime</text>

  <rect class="clarifyBox" x="595" y="450" width="410" height="160"/>
  <text class="sectionTitle" x="736" y="487">B. clarify</text>
  <rect class="box" x="625" y="515" width="150" height="56"/>
  <text class="label" x="657" y="549">保存 missing</text>
  <rect class="box" x="825" y="515" width="150" height="56"/>
  <text class="label" x="870" y="549">保存 known input</text>
  <text class="sub" x="625" y="595">返回追问；下轮只补新字段，service 负责 merge</text>

  <rect class="workflowBox" x="1090" y="450" width="410" height="160"/>
  <text class="sectionTitle" x="1223" y="487">C. workflow</text>
  <rect class="box" x="1120" y="515" width="150" height="56"/>
  <text class="label" x="1142" y="549">WorkflowService</text>
  <rect class="box" x="1310" y="515" width="160" height="56"/>
  <text class="label" x="1340" y="549">WorkflowRegistry</text>
  <text class="sub" x="1123" y="595">进入 deterministic workflow runtime</text>

  <path class="arrow" d="M 1340 263 L 305 450"/>
  <path class="arrow" d="M 1340 263 L 800 450"/>
  <path class="arrow" d="M 1340 263 L 1295 450"/>

  <rect class="panel" x="40" y="690" width="1520" height="340"/>
  <text class="sectionTitle" x="65" y="728">3. 具体执行</text>

  <rect class="chatBox" x="80" y="770" width="450" height="220"/>
  <text class="sectionTitle" x="200" y="808">Chat Runtime 细节</text>
  <rect class="box" x="110" y="835" width="180" height="48"/>
  <text class="label" x="152" y="865">Memory capture</text>
  <rect class="box" x="320" y="835" width="180" height="48"/>
  <text class="label" x="339" y="865">Prompt + LLM planning</text>
  <polygon class="decision" points="305,915 365,955 305,995 245,955"/>
  <text class="label" x="286" y="952">需要</text>
  <text class="label" x="289" y="971">tools?</text>
  <rect class="box" x="420" y="928" width="90" height="54"/>
  <text class="tiny" x="437" y="960">Tool</text>
  <text class="tiny" x="430" y="976">Dispatcher</text>
  <text class="sub" x="112" y="1010">无工具: 直接回答；有工具: 执行后再生成最终回复</text>
  <path class="arrow" d="M 290 859 L 320 859"/>
  <path class="arrow" d="M 410 883 L 410 905 L 336 905"/>
  <path class="arrow" d="M 305 883 L 305 915"/>
  <path class="arrow" d="M 365 955 L 420 955"/>

  <rect class="workflowBox" x="565" y="770" width="420" height="220"/>
  <text class="sectionTitle" x="680" y="808">Meeting Workflow</text>
  <rect class="box" x="605" y="835" width="140" height="44"/>
  <text class="tiny" x="639" y="862">SummaryStep</text>
  <rect class="box" x="605" y="895" width="140" height="44"/>
  <text class="tiny" x="624" y="922">ActionItemStep</text>
  <rect class="box" x="605" y="955" width="140" height="44"/>
  <text class="tiny" x="649" y="982">MemoStep</text>
  <rect class="box" x="795" y="835" width="140" height="44"/>
  <text class="tiny" x="816" y="862">SaveMemoryStep</text>
  <rect class="box" x="795" y="895" width="140" height="44"/>
  <text class="tiny" x="824" y="922">SendTeamsStep</text>
  <rect class="cacheBox" x="780" y="955" width="170" height="44"/>
  <text class="tiny" x="808" y="982">缓存命中: 跳过 save_memory</text>
  <path class="arrow" d="M 675 879 L 675 895"/>
  <path class="arrow" d="M 675 939 L 675 955"/>
  <path class="arrow" d="M 745 977 L 795 857"/>
  <path class="arrow" d="M 865 879 L 865 895"/>

  <rect class="workflowBox" x="1020" y="770" width="500" height="220"/>
  <text class="sectionTitle" x="1180" y="808">Bug Workflow</text>
  <rect class="box" x="1060" y="835" width="150" height="44"/>
  <text class="tiny" x="1094" y="862">AnalysisStep</text>
  <rect class="box" x="1060" y="895" width="150" height="44"/>
  <text class="tiny" x="1083" y="922">RootCauseStep</text>
  <rect class="box" x="1060" y="955" width="150" height="44"/>
  <text class="tiny" x="1070" y="982">JiraCommentStep</text>
  <rect class="box" x="1260" y="835" width="180" height="44"/>
  <text class="tiny" x="1281" y="862">PostJiraCommentStep</text>
  <rect class="cacheBox" x="1260" y="895" width="220" height="44"/>
  <text class="tiny" x="1280" y="922">缓存命中: 复用 comment，可重放 Jira</text>
  <path class="arrow" d="M 1135 879 L 1135 895"/>
  <path class="arrow" d="M 1135 939 L 1135 955"/>
  <path class="arrow" d="M 1210 977 L 1260 857"/>

  <rect class="box" x="1280" y="960" width="250" height="50"/>
  <text class="label" x="1360" y="991">最终文本返回前端</text>

  <path class="arrow" d="M 305 610 L 305 770"/>
  <path class="arrow" d="M 1295 610 L 1295 735 L 775 735 L 775 770"/>
  <path class="arrow" d="M 1295 610 L 1295 770"/>
  <path class="arrow dashed" d="M 800 610 L 800 690"/>

  <rect x="50" y="1045" width="18" height="18" fill="#eef8f1" stroke="#3f7b56" stroke-width="2"/>
  <text class="tiny" x="78" y="1058">普通 chat 路径</text>
  <rect x="210" y="1045" width="18" height="18" fill="#fff2f0" stroke="#b44c43" stroke-width="2"/>
  <text class="tiny" x="238" y="1058">clarification 路径</text>
  <rect x="390" y="1045" width="18" height="18" fill="#eef5ff" stroke="#3f6fa8" stroke-width="2"/>
  <text class="tiny" x="418" y="1058">workflow 路径</text>
  <rect x="560" y="1045" width="18" height="18" fill="#f4f0ff" stroke="#7a59b4" stroke-width="2"/>
  <text class="tiny" x="588" y="1058">缓存语义</text>
</svg>
