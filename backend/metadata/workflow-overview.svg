<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="980" viewBox="0 0 1680 980" role="img" aria-labelledby="title desc">
  <title id="title">Ella Agent 总览流程图</title>
  <desc id="desc">前端输入经过 API、ChatService、Planner 后，分流到普通 Chat Runtime、Clarification 或 Workflow Runtime 的总览图。</desc>
  <defs>
    <style>
      .bg { fill: #f7f4ea; }
      .panel { fill: #fffdf7; stroke: #b9aa84; stroke-width: 2; rx: 18; ry: 18; }
      .box { fill: #fff; stroke: #39424e; stroke-width: 2; rx: 14; ry: 14; }
      .decision { fill: #fff8e1; stroke: #8a6a00; stroke-width: 2; }
      .workflow { fill: #eef6ff; stroke: #2d5b8a; stroke-width: 2; rx: 14; ry: 14; }
      .chat { fill: #edf8f1; stroke: #2f6b4f; stroke-width: 2; rx: 14; ry: 14; }
      .clarify { fill: #fff1f0; stroke: #a3423c; stroke-width: 2; rx: 14; ry: 14; }
      .cache { fill: #f5f0ff; stroke: #6b4ea2; stroke-width: 2; rx: 14; ry: 14; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #222; }
      .subtitle { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #3d3d3d; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1f2933; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #3f4c5a; }
      .arrow { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="980"/>
  <text class="title" x="60" y="58">Ella Agent 前后端总览流程</text>
  <text class="subtitle" x="60" y="88">Frontend 输入先进入统一 chat 入口，再由 planner 分流到普通对话、clarification 或 deterministic workflow。</text>

  <rect class="panel" x="40" y="120" width="300" height="220"/>
  <text class="subtitle" x="60" y="155">Frontend / API</text>
  <rect class="box" x="60" y="185" width="260" height="58"/>
  <text class="label" x="90" y="220">Frontend 输入</text>
  <text class="small" x="90" y="240">message + 可选 session_id</text>
  <rect class="box" x="60" y="265" width="260" height="58"/>
  <text class="label" x="90" y="300">POST /api/chat</text>
  <text class="small" x="90" y="320">或 /api/chat/debug</text>

  <rect class="panel" x="390" y="120" width="360" height="380"/>
  <text class="subtitle" x="410" y="155">ChatService 路由层</text>
  <rect class="box" x="420" y="185" width="300" height="58"/>
  <text class="label" x="500" y="220">ChatService</text>
  <rect class="decision" x="475" y="275" width="190" height="90" transform="rotate(45 570 320)"/>
  <text class="label" x="502" y="314">是否有 pending</text>
  <text class="label" x="505" y="336">clarification</text>
  <rect class="box" x="420" y="390" width="300" height="70"/>
  <text class="label" x="468" y="420">WorkflowPlanner</text>
  <text class="small" x="455" y="442">plan / resolve_clarification</text>

  <rect class="panel" x="810" y="120" width="820" height="780"/>
  <text class="subtitle" x="830" y="155">Planner 结果分流</text>

  <rect class="chat" x="850" y="200" width="220" height="84"/>
  <text class="label" x="945" y="235">chat</text>
  <text class="small" x="890" y="257">进入普通 Chat Runtime</text>

  <rect class="clarify" x="1120" y="200" width="220" height="84"/>
  <text class="label" x="1198" y="235">clarify</text>
  <text class="small" x="1157" y="257">返回追问并写入 store</text>

  <rect class="workflow" x="1390" y="200" width="220" height="84"/>
  <text class="label" x="1478" y="235">workflow</text>
  <text class="small" x="1432" y="257">进入 Workflow Runtime</text>

  <rect class="chat" x="850" y="340" width="330" height="480"/>
  <text class="subtitle" x="875" y="375">普通 Chat Runtime</text>
  <rect class="box" x="885" y="405" width="260" height="54"/>
  <text class="label" x="968" y="438">ChatAgent</text>
  <rect class="box" x="885" y="485" width="260" height="54"/>
  <text class="label" x="953" y="518">AgentRuntime</text>
  <rect class="box" x="885" y="565" width="260" height="54"/>
  <text class="small" x="945" y="598">Memory capture</text>
  <rect class="box" x="885" y="645" width="260" height="54"/>
  <text class="small" x="915" y="678">Prompt build + LLM planning</text>
  <rect class="decision" x="950" y="735" width="130" height="130" transform="rotate(45 1015 800)"/>
  <text class="small" x="978" y="795">需要</text>
  <text class="small" x="984" y="815">tools?</text>
  <rect class="box" x="1140" y="725" width="190" height="60"/>
  <text class="small" x="1174" y="760">ToolDispatcher</text>
  <rect class="box" x="1140" y="805" width="190" height="60"/>
  <text class="small" x="1170" y="840">Final LLM answer</text>

  <rect class="clarify" x="1120" y="340" width="220" height="180"/>
  <text class="subtitle" x="1150" y="375">Clarification</text>
  <rect class="box" x="1145" y="405" width="170" height="50"/>
  <text class="small" x="1182" y="437">保存 missing_fields</text>
  <rect class="box" x="1145" y="470" width="170" height="50"/>
  <text class="small" x="1170" y="502">保存已知 input</text>
  <text class="small" x="1148" y="548">下轮用户回复后继续 resolve，</text>
  <text class="small" x="1148" y="570">只补新字段也可 merge。</text>

  <rect class="workflow" x="1390" y="340" width="220" height="520"/>
  <text class="subtitle" x="1420" y="375">Workflow Runtime</text>
  <rect class="box" x="1415" y="405" width="170" height="54"/>
  <text class="small" x="1452" y="438">WorkflowService</text>
  <rect class="box" x="1415" y="485" width="170" height="54"/>
  <text class="small" x="1450" y="518">WorkflowRegistry</text>
  <rect class="box" x="1415" y="565" width="170" height="54"/>
  <text class="small" x="1452" y="598">meeting / bug</text>
  <rect class="cache" x="1415" y="645" width="170" height="70"/>
  <text class="small" x="1440" y="676">Artifact Cache</text>
  <text class="small" x="1444" y="696">lookup / store</text>
  <rect class="box" x="1415" y="740" width="170" height="50"/>
  <text class="small" x="1437" y="772">命中: 复用内容</text>
  <rect class="box" x="1415" y="805" width="170" height="50"/>
  <text class="small" x="1425" y="837">重放 Teams/Jira 副作用</text>

  <rect class="panel" x="40" y="390" width="710" height="510"/>
  <text class="subtitle" x="60" y="425">Meeting / Bug 具体步骤</text>

  <rect class="workflow" x="70" y="470" width="300" height="360"/>
  <text class="subtitle" x="95" y="505">Meeting Workflow</text>
  <rect class="box" x="100" y="540" width="240" height="48"/>
  <text class="small" x="184" y="570">SummaryStep</text>
  <rect class="box" x="100" y="605" width="240" height="48"/>
  <text class="small" x="169" y="635">ActionItemStep</text>
  <rect class="box" x="100" y="670" width="240" height="48"/>
  <text class="small" x="194" y="700">MemoStep</text>
  <rect class="box" x="100" y="735" width="240" height="48"/>
  <text class="small" x="168" y="765">SaveMemoryStep</text>
  <rect class="box" x="100" y="800" width="240" height="48"/>
  <text class="small" x="180" y="830">SendTeamsStep</text>

  <rect class="workflow" x="400" y="470" width="320" height="360"/>
  <text class="subtitle" x="425" y="505">Bug Workflow</text>
  <rect class="box" x="440" y="540" width="240" height="48"/>
  <text class="small" x="526" y="570">AnalysisStep</text>
  <rect class="box" x="440" y="605" width="240" height="48"/>
  <text class="small" x="518" y="635">RootCauseStep</text>
  <rect class="box" x="440" y="670" width="240" height="48"/>
  <text class="small" x="507" y="700">JiraCommentStep</text>
  <rect class="box" x="440" y="735" width="240" height="48"/>
  <text class="small" x="500" y="765">PostJiraCommentStep</text>

  <rect class="box" x="1120" y="600" width="490" height="90"/>
  <text class="label" x="1240" y="635">最终输出格式化</text>
  <text class="small" x="1150" y="660">Chat: 直接流式文本返回前端</text>
  <text class="small" x="1150" y="682">Workflow: 已执行 workflow + 缓存状态 + memo/jira comment</text>

  <path class="arrow" d="M 320 214 L 420 214"/>
  <path class="arrow" d="M 570 243 L 570 275"/>
  <path class="arrow" d="M 570 365 L 570 390"/>
  <path class="arrow" d="M 720 425 L 850 242"/>
  <path class="arrow" d="M 720 425 L 1120 242"/>
  <path class="arrow" d="M 720 425 L 1390 242"/>

  <path class="arrow" d="M 960 284 L 960 340"/>
  <path class="arrow" d="M 1230 284 L 1230 340"/>
  <path class="arrow" d="M 1500 284 L 1500 340"/>

  <path class="arrow" d="M 1015 459 L 1015 485"/>
  <path class="arrow" d="M 1015 539 L 1015 565"/>
  <path class="arrow" d="M 1015 619 L 1015 645"/>
  <path class="arrow" d="M 1015 699 L 1015 735"/>
  <path class="arrow" d="M 1080 800 L 1140 755"/>
  <path class="arrow dashed" d="M 1140 835 L 1080 835 L 1080 860 L 1015 860"/>

  <path class="arrow" d="M 1500 459 L 1500 485"/>
  <path class="arrow" d="M 1500 539 L 1500 565"/>
  <path class="arrow" d="M 1500 619 L 1500 645"/>
  <path class="arrow" d="M 1500 715 L 1500 740"/>
  <path class="arrow" d="M 1500 790 L 1500 805"/>

  <path class="arrow" d="M 220 588 L 220 605"/>
  <path class="arrow" d="M 220 653 L 220 670"/>
  <path class="arrow" d="M 220 718 L 220 735"/>
  <path class="arrow" d="M 220 783 L 220 800"/>

  <path class="arrow" d="M 560 588 L 560 605"/>
  <path class="arrow" d="M 560 653 L 560 670"/>
  <path class="arrow" d="M 560 718 L 560 735"/>

  <path class="arrow dashed" d="M 1340 440 L 1220 440 L 1220 455"/>
  <path class="arrow dashed" d="M 1390 592 L 720 592"/>
  <path class="arrow dashed" d="M 220 470 L 220 440 L 1415 440"/>
  <path class="arrow dashed" d="M 560 470 L 560 440 L 1415 440"/>

  <text class="small" x="590" y="265">有</text>
  <text class="small" x="680" y="350">无</text>
  <text class="small" x="1090" y="785">是</text>
  <text class="small" x="985" y="890">否: 直接回答</text>
  <text class="small" x="1450" y="732">命中</text>
  <text class="small" x="1420" y="874">或完整执行</text>

  <rect x="60" y="920" width="18" height="18" fill="#edf8f1" stroke="#2f6b4f" stroke-width="2"/>
  <text class="small" x="88" y="934">普通聊天路径</text>
  <rect x="240" y="920" width="18" height="18" fill="#fff1f0" stroke="#a3423c" stroke-width="2"/>
  <text class="small" x="268" y="934">澄清路径</text>
  <rect x="390" y="920" width="18" height="18" fill="#eef6ff" stroke="#2d5b8a" stroke-width="2"/>
  <text class="small" x="418" y="934">workflow 路径</text>
  <rect x="560" y="920" width="18" height="18" fill="#f5f0ff" stroke="#6b4ea2" stroke-width="2"/>
  <text class="small" x="588" y="934">缓存/副作用语义</text>
</svg>
