<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2600" viewBox="0 0 1200 2600">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #16324f; }
      .label { font: 16px Arial, sans-serif; fill: #16324f; }
      .small { font: 14px Arial, sans-serif; fill: #16324f; }
      .box { fill: #eef6ff; stroke: #2f6db2; stroke-width: 2; rx: 12; ry: 12; }
      .decision { fill: #fff7e6; stroke: #d48a00; stroke-width: 2; }
      .db { fill: #edf9f0; stroke: #2d8a4b; stroke-width: 2; rx: 12; ry: 12; }
      .line { stroke: #4a5568; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="2600" fill="#fbfdff" />
  <text x="600" y="50" text-anchor="middle" class="title">Ella Agent Memory Workflow</text>

  <rect class="box" x="440" y="90" width="320" height="56" />
  <text x="600" y="125" text-anchor="middle" class="label">User sends message</text>

  <rect class="box" x="440" y="180" width="320" height="56" />
  <text x="600" y="215" text-anchor="middle" class="label">POST /api/chat</text>

  <polygon class="decision" points="600,280 760,350 600,420 440,350" />
  <text x="600" y="345" text-anchor="middle" class="label">session_id</text>
  <text x="600" y="367" text-anchor="middle" class="label">provided?</text>

  <rect class="box" x="180" y="458" width="280" height="56" />
  <text x="320" y="493" text-anchor="middle" class="label">Generate session_id</text>

  <rect class="box" x="740" y="458" width="280" height="56" />
  <text x="880" y="493" text-anchor="middle" class="label">Use existing session_id</text>

  <rect class="box" x="120" y="550" width="400" height="56" />
  <text x="320" y="585" text-anchor="middle" class="label">Return X-Session-Id response header</text>

  <rect class="box" x="440" y="650" width="320" height="56" />
  <text x="600" y="685" text-anchor="middle" class="label">ChatService.stream_response</text>

  <rect class="box" x="440" y="740" width="320" height="56" />
  <text x="600" y="775" text-anchor="middle" class="label">ChatAgent.stream_response</text>

  <rect class="box" x="440" y="830" width="320" height="56" />
  <text x="600" y="865" text-anchor="middle" class="label">Save user message to short-term memory</text>

  <rect class="db" x="440" y="920" width="320" height="56" />
  <text x="600" y="955" text-anchor="middle" class="label">Save to conversation_messages</text>

  <rect class="box" x="440" y="1010" width="320" height="56" />
  <text x="600" y="1045" text-anchor="middle" class="label">LLM extract memories from message</text>

  <polygon class="decision" points="600,1110 760,1180 600,1250 440,1180" />
  <text x="600" y="1175" text-anchor="middle" class="label">Valid JSON</text>
  <text x="600" y="1197" text-anchor="middle" class="label">memories?</text>

  <rect class="box" x="160" y="1288" width="320" height="56" />
  <text x="320" y="1323" text-anchor="middle" class="label">Skip memory extraction</text>

  <rect class="box" x="720" y="1288" width="320" height="56" />
  <text x="880" y="1312" text-anchor="middle" class="small">Normalize memory_type,</text>
  <text x="880" y="1332" text-anchor="middle" class="small">content, keywords</text>

  <rect class="db" x="720" y="1380" width="320" height="56" />
  <text x="880" y="1415" text-anchor="middle" class="label">Save to memories</text>

  <rect class="box" x="440" y="1480" width="320" height="56" />
  <text x="600" y="1515" text-anchor="middle" class="label">Build memory context</text>

  <rect class="box" x="120" y="1570" width="380" height="70" />
  <text x="310" y="1600" text-anchor="middle" class="small">Load recent conversation</text>
  <text x="310" y="1622" text-anchor="middle" class="small">from in-memory session cache</text>

  <rect class="db" x="700" y="1570" width="380" height="70" />
  <text x="890" y="1600" text-anchor="middle" class="small">Search relevant long-term</text>
  <text x="890" y="1622" text-anchor="middle" class="small">memories from DB</text>

  <rect class="box" x="440" y="1680" width="320" height="56" />
  <text x="600" y="1715" text-anchor="middle" class="label">Compose effective prompt</text>

  <rect class="box" x="440" y="1770" width="320" height="56" />
  <text x="600" y="1805" text-anchor="middle" class="label">LLM planning call</text>

  <polygon class="decision" points="600,1870 760,1940 600,2010 440,1940" />
  <text x="600" y="1935" text-anchor="middle" class="label">Tool calls</text>
  <text x="600" y="1957" text-anchor="middle" class="label">needed?</text>

  <rect class="box" x="130" y="2048" width="320" height="56" />
  <text x="290" y="2083" text-anchor="middle" class="label">Return direct answer</text>

  <rect class="box" x="750" y="2048" width="320" height="56" />
  <text x="910" y="2083" text-anchor="middle" class="label">Dispatch tools on backend</text>

  <rect class="box" x="750" y="2140" width="320" height="56" />
  <text x="910" y="2175" text-anchor="middle" class="label">Collect tool results</text>

  <rect class="box" x="750" y="2232" width="320" height="56" />
  <text x="910" y="2267" text-anchor="middle" class="small">LLM final answer with tool</text>
  <text x="910" y="2287" text-anchor="middle" class="small">results</text>

  <rect class="box" x="440" y="2340" width="320" height="56" />
  <text x="600" y="2375" text-anchor="middle" class="label">Stream answer to client</text>

  <rect class="box" x="440" y="2432" width="320" height="56" />
  <text x="600" y="2467" text-anchor="middle" class="label">Accumulate final assistant text</text>

  <rect class="box" x="440" y="2524" width="320" height="56" />
  <text x="600" y="2559" text-anchor="middle" class="small">Save assistant message to</text>
  <text x="600" y="2579" text-anchor="middle" class="small">short-term memory</text>

  <rect class="db" x="440" y="2616" width="320" height="56" />
  <text x="600" y="2651" text-anchor="middle" class="small">Save assistant message to</text>
  <text x="600" y="2671" text-anchor="middle" class="small">conversation_messages table</text>

  <line class="line" x1="600" y1="146" x2="600" y2="180" />
  <line class="line" x1="600" y1="236" x2="600" y2="280" />

  <line class="line" x1="520" y1="385" x2="320" y2="458" />
  <text x="430" y="430" text-anchor="middle" class="small">No</text>
  <line class="line" x1="680" y1="385" x2="880" y2="458" />
  <text x="770" y="430" text-anchor="middle" class="small">Yes</text>

  <line class="line" x1="320" y1="514" x2="320" y2="550" />
  <line class="line" x1="320" y1="606" x2="520" y2="650" />
  <line class="line" x1="880" y1="514" x2="680" y2="650" />

  <line class="line" x1="600" y1="706" x2="600" y2="740" />
  <line class="line" x1="600" y1="796" x2="600" y2="830" />
  <line class="line" x1="600" y1="886" x2="600" y2="920" />
  <line class="line" x1="600" y1="976" x2="600" y2="1010" />
  <line class="line" x1="600" y1="1066" x2="600" y2="1110" />

  <line class="line" x1="520" y1="1215" x2="320" y2="1288" />
  <text x="430" y="1260" text-anchor="middle" class="small">No</text>
  <line class="line" x1="680" y1="1215" x2="880" y2="1288" />
  <text x="770" y="1260" text-anchor="middle" class="small">Yes</text>

  <line class="line" x1="880" y1="1344" x2="880" y2="1380" />
  <line class="line" x1="320" y1="1344" x2="520" y2="1480" />
  <line class="line" x1="880" y1="1436" x2="680" y2="1480" />

  <line class="line" x1="600" y1="1536" x2="600" y2="1680" />
  <line class="line dashed" x1="500" y1="1510" x2="310" y2="1570" />
  <line class="line dashed" x1="700" y1="1510" x2="890" y2="1570" />
  <line class="line dashed" x1="310" y1="1640" x2="520" y2="1708" />
  <line class="line dashed" x1="890" y1="1640" x2="680" y2="1708" />
  <line class="line" x1="600" y1="1736" x2="600" y2="1770" />
  <line class="line" x1="600" y1="1826" x2="600" y2="1870" />

  <line class="line" x1="520" y1="1975" x2="290" y2="2048" />
  <text x="425" y="2020" text-anchor="middle" class="small">No</text>
  <line class="line" x1="680" y1="1975" x2="910" y2="2048" />
  <text x="775" y="2020" text-anchor="middle" class="small">Yes</text>

  <line class="line" x1="910" y1="2104" x2="910" y2="2140" />
  <line class="line" x1="910" y1="2196" x2="910" y2="2232" />
  <line class="line" x1="290" y1="2104" x2="520" y2="2340" />
  <line class="line" x1="910" y1="2288" x2="680" y2="2340" />
  <line class="line" x1="600" y1="2396" x2="600" y2="2432" />
  <line class="line" x1="600" y1="2488" x2="600" y2="2524" />
  <line class="line" x1="600" y1="2580" x2="600" y2="2616" />

  <rect class="box" x="60" y="1460" width="250" height="170" />
  <text x="185" y="1490" text-anchor="middle" class="label">Memory Inputs</text>
  <text x="85" y="1520" class="small">1. Recent dialogue</text>
  <text x="85" y="1548" class="small">2. Relevant memories</text>
  <text x="85" y="1576" class="small">3. Current user message</text>
  <text x="85" y="1604" class="small">4. Same session_id</text>

  <rect class="box" x="820" y="1700" width="310" height="120" />
  <text x="975" y="1732" text-anchor="middle" class="label">Planning Output</text>
  <text x="845" y="1762" class="small">The main LLM decides whether</text>
  <text x="845" y="1786" class="small">a tool call is needed for the</text>
  <text x="845" y="1810" class="small">current question.</text>
</svg>
